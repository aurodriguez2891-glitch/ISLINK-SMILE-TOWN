<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nas Memórias Dela</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: monospace;
            cursor: pointer;
        }

        #start-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #ff0000;
            color: white;
            border: none;
            cursor: pointer;
            font-family: monospace;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            z-index: 10000;
        }

        #jumpscare-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #jumpscare-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scare-effect {
            animation: flash-and-shake 0.1s infinite alternate;
        }

        @keyframes flash-and-shake {
            0% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
                filter: invert(0%);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.15) translate(-10px, 10px);
                filter: invert(30%);
            }
            100% {
                opacity: 1;
                transform: scale(1.25) translate(10px, -10px);
                filter: invert(100%);
            }
        }
    </style>
</head>
<body>

    <button id="start-btn">CLIQUE PARA ACESSAR AS MEMÓRIAS</button>

    <div id="jumpscare-container">
        <img id="jumpscare-img" class="scare-effect" src="aindanao.png" alt="Jumpscare">
    </div>

    <audio id="scare-sound" src="SMILEDOG.mp3" preload="auto" loop></audio>

    <script>
        const btn = document.getElementById('start-btn');
        const container = document.getElementById('jumpscare-container');
        const sound = document.getElementById('scare-sound');

        function triggerPrank() {
            btn.style.display = 'none';
            container.style.display = 'flex';

            sound.volume = 1.0;
            sound.play().catch(err => console.log(err));

            // Dispara várias janelas espalhadas pela tela de uma só vez
            let totalJanelas = 12; // Podes aumentar se quiseres (cuidado para não travar o PC deles)
            
            for (let i = 0; i < totalJanelas; i++) {
                setTimeout(() => {
                    const randomX = Math.floor(Math.random() * (window.screen.width - 500));
                    const randomY = Math.floor(Math.random() * (window.screen.height - 400));
                    const largura = 400 + Math.floor(Math.random() * 200);
                    const altura = 300 + Math.floor(Math.random() * 200);
                    
                    window.open(window.location.href, '_blank', `width=${largura},height=${altura},left=${randomX},top=${randomY}`);
                }, i * 50); // Abre uma rajada quase instantânea com 50ms de diferença entre cada uma
            }
        }

        btn.addEventListener('click', triggerPrank);
    </script>
</body>
</html>
