<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nas Memórias Dela</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="placa (1) (1).jpg">
    <style>
        body {
            background-color: #0b0b0b;
            color: #c7c7c7;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        iframe {
            max-width: 100%;
        }

        .container-interativo {
            max-width: 1060px;
            margin: 30px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
        }

        .bloco-secreto {
            flex: 1;
            min-width: 300px;
            text-align: left;
        }

        .bloco-secreto input {
            padding: 8px 12px;
            font-size: 14px;
            background: transparent;
            border: 1px solid #666;
            color: #fff;
            width: 260px;
            max-width: 100%;
            margin-right: 8px;
            font-family: monospace;
        }

        .bloco-secreto button {
            padding: 8px 16px;
            font-size: 14px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
            font-family: monospace;
        }

        .bloco-secreto button:hover {
            background: #444;
        }

        #conteudo-secreto {
            display: none;
            margin-top: 15px;
        }

        #conteudo-secreto img {
            width: 200px;
            border-radius: 5px;
            cursor: pointer;
        }

        #texto-secreto {
            display: none;
            margin-top: 15px;
            font-size: 16px;
            color: #ff5555;
            letter-spacing: 2px;
        }

        #mensagem-status {
            font-size: 14px;
            margin-top: 8px;
            color: #888;
        }

        /* --- ESTILOS DO CHAT DO SLINKY --- */
        .chat-slinky-box {
            width: 380px;
            max-width: 100%;
            background: #111111;
            border: 1px solid #444;
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 10px 14px;
            border-bottom: 1px solid #444;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .chat-messages {
            height: 240px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
        }

        .msg {
            padding: 8px 10px;
            border: 1px solid #333;
            max-width: 85%;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: #1c1c1c;
            color: #ffffff;
            border-color: #666;
        }

        .msg.slinky {
            align-self: flex-start;
            background: #0b0b0b;
            color: #a3a3a3;
            border-color: #333;
        }

        .msg.slinky strong {
            color: #ff5555;
            font-weight: normal;
        }

        .chat-input-area {
            display: flex;
            border-top: 1px solid #444;
            background: #0b0b0b;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #fff;
            font-family: monospace;
            font-size: 13px;
            outline: none;
        }

        .chat-input-area button {
            padding: 10px 14px;
            background: #222;
            color: #c7c7c7;
            border: none;
            border-left: 1px solid #444;
            cursor: pointer;
            font-family: monospace;
            font-size: 13px;
        }

        .chat-input-area button:hover {
            background: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>22:00</h1>
 
    <!-- Vídeo principal -->
    <iframe width="1060" height="615" src="https://www.youtube.com/embed/AmZhiPSdrdc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>

    <div class="container-interativo">
        <!-- BLOCO DE SENHAS / PALAVRAS SECRETAS -->
        <div class="bloco-secreto">
            <input type="text" id="inputPalavras" placeholder="...">
            <button onclick="verificarPalavras()">Enviar</button>
            <p id="mensagem-status"></p>

            <!-- LINK COM A IMAGEM (Aparece se digitar "bem vindo") -->
            <div id="conteudo-secreto">
                <a href="https://youtu.be/XcQyjXF4ihU" target="_blank">
                    <img src="bemali.png" alt="Porta Secreta">
                </a>
            </div>

            <!-- TEXTO SECRETO (Aparece se digitar "tentar novamente") -->
            <div id="texto-secreto">
                <p>1134 79 87</p>
            </div>
        </div>

        <!-- CHAT DO SLINKY -->
        <div class="chat-slinky-box">
            <div class="chat-header">CONEXÃO: SLINKY</div>
            <div class="chat-messages" id="chatMessages">
                <div class="msg slinky"><strong>[SLINKY]:</strong> ...você ainda está aí?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="fale com ele..." autocomplete="off">
                <button onclick="enviarMensagemSlinky()">></button>
            </div>
        </div>
    </div>

    <script>
        // --- LÓGICA DAS PALAVRAS SECRETAS ---
        function verificarPalavras() {
            const inputUser = document.getElementById("inputPalavras").value.trim().toLowerCase();
            const elementoSecreto = document.getElementById("conteudo-secreto");
            const textoSecreto = document.getElementById("texto-secreto");
            const mensagemStatus = document.getElementById("mensagem-status");

            elementoSecreto.style.display = "none";
            textoSecreto.style.display = "none";

            if (inputUser === "bem vindo") {
                elementoSecreto.style.display = "block";
                mensagemStatus.textContent = ":)";
                mensagemStatus.style.color = "#8f8";
            } else if (inputUser === "porta") {
                window.location.href = "https://aurodriguez2891-glitch.github.io/ISLINK-SMILE-TOWN/PORTA.txt";
            } else if (inputUser === "tentar novamente") {
                textoSecreto.style.display = "block";
                mensagemStatus.textContent = ":|";
                mensagemStatus.style.color = "#ff5555";
            } else {
                mensagemStatus.textContent = ":(";
                mensagemStatus.style.color = "#888";
            }
        }

        // --- LÓGICA DO CHAT FALSO DO SLINKY (Responde a QUALQUER input) ---
        const chatMessages = document.getElementById("chatMessages");
        const chatInput = document.getElementById("chatInput");

        const reacoesSlinky = [
            "interessante você dizer isso...",
            "isso não vai mudar o que aconteceu às 22:00.",
            "eu ouvi o que você digitou. mas será que é verdade?",
            "as paredes daqui gravam tudo o que você fala.",
            "você repete isso como se importasse.",
            "não tente me confundir.",
            "olhe para trás.",
            "esse arquivo está corrompido, assim como suas escolhas."
        ];

        function adicionarNoChat(texto, tipo) {
            const div = document.createElement("div");
            div.classList.add("msg", tipo);

            if (tipo === "slinky") {
                div.innerHTML = `<strong>[SLINKY]:</strong> ${texto}`;
            } else {
                div.textContent = texto;
            }

            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function enviarMensagemSlinky() {
            const texto = chatInput.value.trim();
            if (texto === "") return;

            adicionarNoChat(texto, "user");
            chatInput.value = "";

            setTimeout(() => {
                let respostaFinal = "";
                const fraseAleatoria = reacoesSlinky[Math.floor(Math.random() * reacoesSlinky.length)];

                // Chance de ele ecoar parte do que o utilizador digitou
                if (Math.random() > 0.5 && texto.length > 3) {
                    respostaFinal = `você disse "${texto}"... ${fraseAleatoria}`;
                } else {
                    respostaFinal = fraseAleatoria;
                }

                adicionarNoChat(respostaFinal, "slinky");
            }, 600);
        }

        chatInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                enviarMensagemSlinky();
            }
        });
    </script>
</body>
</html>
