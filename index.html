<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nas Memórias Dela</title>
    <style>
        /* O fundo começa com a cor normal e tem uma transição suave de 2 segundos */
        body {
            background-color: #ffffff; /* Põe aqui a cor inicial que preferires */
            color: #000000;            /* Cor do texto inicial */
            font-family: monospace;
            margin: 0;
            padding: 20px;
            transition: background-color 2s ease, color 2s ease;
        }

        /* Classe que será aplicada pelo JavaScript após 30 segundos */
        body.modo-escuro {
            background-color: #0b0b0b; /* Fundo escuro */
            color: #c7c7c7;            /* Texto adaptado para o escuro */
        }
    </style>
</head>
<body>

    <h1>Acompanha a investigação...</h1>
    <p>Algo vai mudar daqui a 30 segundos.</p>

    <script>
        // setTimeout espera o tempo em milissegundos (30000 ms = 30 segundos)
        setTimeout(function() {
            // Adiciona a classe "modo-escuro" à tag <body>
            document.body.classList.add('modo-escuro');
            console.p("A luz apagou-se."); // Opcional: log para testar
        }, 30000); // 30000 milissegundos = 30 segundos
    </script>

</body>
</html>
