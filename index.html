<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nas Memórias Dela</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: monospace;
            cursor: pointer;
        }

        #jumpscare-container {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #jumpscare-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scare-effect {
            animation: flash-and-shake 0.1s infinite alternate;
        }

        @keyframes flash-and-shake {
            0% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
                filter: invert(0%);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.15) translate(-10px, 10px);
                filter: invert(30%);
            }
            100% {
                opacity: 1;
                transform: scale(1.25) translate(10px, -10px);
                filter: invert(100%);
            }
        }
    </style>
</head>
<body>

    <div id="jumpscare-container">
        <img id="jumpscare-img" class="scare-effect" src="aindanao.png" alt="Jumpscare">
    </div>

    <audio id="scare-sound" src="SMILEDOG.mp3" preload="auto" loop></audio>

    <script>
        const sound = document.getElementById('scare-sound');

        function startAudio() {
            sound.volume = 1.0;
            sound.play().catch(err => console.log(err));
        }

        window.addEventListener('DOMContentLoaded', startAudio);
        document.body.addEventListener('click', startAudio, { once: true });
    </script>
</body>
</html>
