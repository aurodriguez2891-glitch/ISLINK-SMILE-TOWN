<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nas Memórias Dela</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="placa (1) (1).jpg">
    <style>
        /* Define a animação gradual do fundo */
        @keyframes escurecerGradual {
            0% {
                background-color: #555555; /* Começa num cinza visível */
                color: #ffffff;
            }
            100% {
                background-color: #000000; /* Fica totalmente escuro (preto) */
                color: #888888;
            }
        }

        body {
            background-color: #555555;
            color: #ffffff;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            /* A animação vai durar exatamente 25 segundos e manter o estado final (forwards) */
            animation: escurecerGradual 25s ease forwards;
        }
    </style>
</head>
