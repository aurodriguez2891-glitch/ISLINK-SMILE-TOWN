<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Meu Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Conteúdo principal do site no topo/meio */
        .conteudo-principal {
            flex: 1;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #fff;
        }

        /* Rodapé onde fica o código secreto */
        footer {
            background-color: #1a1a1a;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #333;
            margin-top: auto;
        }

        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            width: 350px;
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #cc0000;
        }

        /* A IMAGEM SECRETA COMEÇA ESCONDIDA */
        #conteudo-secreto {
            display: none;
            margin-top: 20px;
        }

        #conteudo-secreto img {
            width: 250px;
            border-radius: 10px;
            transition: transform 0.3s;
            cursor: pointer;
        }

        #conteudo-secreto img:hover {
            transform: scale(1.05);
        }

        #mensagem-erro {
            color: #ff5555;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- CONTEÚDO PRINCIPAL DO SITE (Visível logo no início) -->
    <div class="conteudo-principal">
        <h1>Bem-vindo ao meu site!</h1>
        <p>Explora o conteúdo principal por aqui...</p>
    </div>

    <!-- FINAL DA PÁGINA / RODAPÉ: ONDE FICA O CÓDIGO SECRETO -->
    <footer>
        <p style="color: #666; font-size: 14px;">Procurando por algo escondido?</p>
        
        <div class="container-secreto">
            <input type="text" id="inputPalavras" placeholder="Insere a frase secreta...">
            <button onclick="verificarPalavras()">Verificar</button>
            <p id="mensagem-erro"></p>

            <!-- IMAGEM E LINK QUE APARECEM APÓS ACERTAR A SENHA -->
            <div id="conteudo-secreto">
                <!-- Substitui "https://www.oseusiteaqui.com" pelo teu link final -->
                <a href="https://www.oseusiteaqui.com" target="_blank">
                    <!-- Substitui "URL_DA_TUA_IMAGEM_AQUI.jpg" pelo caminho da tua imagem -->
                    <img src="URL_DA_TUA_IMAGEM_AQUI.jpg" alt="Aceder ao Link Secreto">
                </a>
                <p><a href="https://aurodriguez2891-glitch.github.io/ISLINK-SMILE-TOWN/" target="_blank" style="color: #ff4444; text-decoration: none;">Clica aqui para abrir o link!</a></p>
            </div>
        </div>
    </footer>

    <script>
        function verificarPalavras() {
            // Frase exata exigida na ordem correta
            const fraseSecreta = "amigos companheiros sorriam até sangrar inteiro";

            // Normaliza o texto inserido (retira espaços extras e converte para minúsculas)
            const inputUser = document.getElementById("inputPalavras").value.trim().toLowerCase();
            const elementoSecreto = document.getElementById("conteudo-secreto");
            const mensagemErro = document.getElementById("mensagem-erro");

            // Validação
            if (inputUser === fraseSecreta) {
                elementoSecreto.style.display = "block"; // Revela a imagem e o link
                mensagemErro.textContent = ":)";
                mensagemErro.style.color = "#55ff55";
            } else {
                elementoSecreto.style.display = "none"; // Mantém escondido
                mensagemErro.textContent = ":(";
                mensagemErro.style.color = "#ff5555";
            }
        }
    </script>

</body>
</html>
