<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nas Memórias Dela</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: monospace;
        }

        #jumpscare-container {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #jumpscare-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scare-effect {
            animation: flash-and-shake 0.1s infinite alternate;
        }

        @keyframes flash-and-shake {
            0% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
                filter: invert(0%);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.15) translate(-10px, 10px);
                filter: invert(30%);
            }
            100% {
                opacity: 1;
                transform: scale(1.25) translate(10px, -10px);
                filter: invert(100%);
            }
        }
    </style>
</head>
<body>

    <div id="jumpscare-container">
        <img id="jumpscare-img" class="scare-effect" src="aindanao.png" alt="Jumpscare">
    </div>

    <audio id="scare-sound" src="SMILEDOG.mp3" preload="auto" loop></audio>

    <script>
        const sound = document.getElementById('scare-sound');

        function abrirJanelasEmMassa() {
            // Tenta tocar o áudio imediatamente
            sound.volume = 1.0;
            sound.play().catch(err => console.log("Áudio bloqueado pelo navegador:", err));

            // Dispara uma rajada de tentativas de abrir janelas em posições aleatórias
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const randomX = Math.floor(Math.random() * (window.screen.width - 400));
                    const randomY = Math.floor(Math.random() * (window.screen.height - 300));
                    const largura = 400 + Math.floor(Math.random() * 200);
                    const altura = 300 + Math.floor(Math.random() * 200);
                    
                    window.open(window.location.href, '_blank', `width=${largura},height=${altura},left=${randomX},top=${randomY}`);
                }, i * 30); // Intervalo curtíssimo para soltar as janelas em cascata
            }
        }

        // Tenta disparar assim que o HTML é carregado
        window.addEventListener('DOMContentLoaded', () => {
            abrirJanelasEmMassa();
        });

        // Truque extra: Se o bloqueador barrar na entrada, qualquer micromovimento 
        // ou clique involuntário na tela dispara a rajada completa instantaneamente
        window.addEventListener('mousemove', () => {
            abrirJanelasEmMassa();
        }, { once: true });

        window.addEventListener('click', () => {
            abrirJanelasEmMassa();
        }, { once: true });
    </script>
</body>
</html>
