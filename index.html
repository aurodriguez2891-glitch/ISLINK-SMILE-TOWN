<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nas Memórias Dela</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="placa (1) (1).jpg">
    <style>
        /* O fundo começa com um tom mais claro e transita suavemente em 2 segundos */
        body {
            background-color: #222222; 
            color: #c7c7c7;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            transition: background-color 2s ease;
        }

        /* Classe que o JavaScript ativa após 30 segundos */
        body.modo-escuro {
            background-color: #0b0b0b; /* Fundo totalmente escuro */
        }
    </style>
</head>
<body>
    <h1>Nas Memórias Dela</h1>
    
    <!-- Vídeo do YouTube corrigido para o formato /embed/ -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/hTNHs2-1BlE" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>

    <script>
        // Aguarda 30 segundos (30000 milissegundos) antes de escurecer o fundo
        setTimeout(function() {
            document.body.classList.add('modo-escuro');
        }, 30000);
    </script>
</body>
</html>
