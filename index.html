<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nas Memórias Dela</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="placa (1) (1).jpg">
    <style>
        body {
            background-color: #0b0b0b;
            color: #c7c7c7;
            font-family: monospace;
            margin: 0;
            padding: 20px;
        }

        .bloco-secreto {
            margin: 30px 0;
            text-align: left;
        }

        .bloco-secreto input {
            padding: 8px 12px;
            font-size: 14px;
            background: transparent;
            border: 1px solid #666;
            color: #fff;
            width: 320px;
            max-width: 100%;
            margin-right: 8px;
        }

        .bloco-secreto button {
            padding: 8px 16px;
            font-size: 14px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
            font-family: monospace;
        }

        .bloco-secreto button:hover {
            background: #444;
        }

        #conteudo-secreto {
            display: none;
            margin-top: 15px;
        }

        #conteudo-secreto img {
            width: 200px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Estilo para a nova mensagem de texto secreta */
        #texto-secreto {
            display: none;
            margin-top: 15px;
            font-size: 16px;
            color: #ff5555;
            letter-spacing: 2px;
        }

        #mensagem-status {
            font-size: 14px;
            margin-top: 8px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>FINALMENTE O SHOW COMEÇOU DE VERDADE!</h1>

</body>
</html>
